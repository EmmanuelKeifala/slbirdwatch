# Local dev services. Redis is on host port 6380 so it doesn't clash with a system Redis on 6379.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: birdwatch
      POSTGRES_PASSWORD: birdwatch
      POSTGRES_DB: birdwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # S3-compatible media storage for dev (production: any S3 / R2 bucket). Console at http://localhost:9001.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: birdwatch
      RUSTFS_SECRET_KEY: birdwatch-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - media:/data

volumes:
  pgdata:
  media:
